<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Bee's World</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            background: #f8f6f1;
            font-family: Arial, sans-serif;
        }
        .register-container {
            width: 100%;
            max-width: 420px;
            padding: 35px 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.12);
        }
        .register-container h1 {
            text-align: center;
            color: #b8860b;
            margin-bottom: 10px;
        }
        .register-intro {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #b8860b;
        }
        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #b8860b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .register-button:hover {
            background: #222;
        }
        .login-link {
            margin-top: 22px;
            text-align: center;
            color: #555;
        }
        .login-link a,
        .home-link a {
            color: #b8860b;
            text-decoration: none;
            font-weight: bold;
        }
        .home-link {
            margin-top: 18px;
            text-align: center;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1><i class="fa-solid fa-gem"></i> Bee's World</h1>
        <p class="register-intro">Create your account and join us!</p>
        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname"
                       placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Create a password"
                       minlength="6" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword"
                       placeholder="Enter your password again"
                       minlength="6" required>
            </div>
            <button type="submit" class="register-button">
                Create Account
            </button>
            <p id="registerMessage" class="message" role="status"></p>
        </form>
        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
        <p class="home-link">
            <a href="index.html">
                <i class="fa-solid fa-house"></i> Back to Home
            </a>
        </p>
    </div>
    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const name = document.getElementById("fullname").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const message = document.getElementById("registerMessage");
            if (password !== confirmPassword) {
                message.style.color = "red";
                message.textContent = "Passwords do not match.";
                return;
            }
            if (localStorage.getItem("beeUser")) {
                const existingUser = JSON.parse(localStorage.getItem("beeUser"));
                if (existingUser.email === email) {
                    message.style.color = "red";
                    message.textContent = "This email is already registered.";
                    return;
                }
            }
            const user = {
                name: name,
                email: email,
                password: password
            };
            localStorage.setItem("beeUser", JSON.stringify(user));
            message.style.color = "green";
            message.textContent = "Account created! Taking you to login...";
            setTimeout(function() {
                window.location.href = "login.html";
            }, 1500);
        });
    </script>
</body>
</html>
